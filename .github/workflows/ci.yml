name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run Ruff Linter
        run: uv run ruff check src tests benchmarks examples eval

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check src tests benchmarks examples eval

      - name: Run Pyright Strict Typecheck
        run: uv run pyright src tests

      - name: Run Pytest & Hypothesis Property Suite
        run: uv run pytest --cov=src/context_assembler tests
